*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
a{color:inherit}h1,h2,h3,h4{margin:0}
.logo{font-size:22px;font-weight:700;line-height:1.1;letter-spacing:-.3px;padding:22px 20px;border-bottom:3px solid var(--or)}
aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--ink);color:#fff;display:flex;flex-direction:column;z-index:5}
nav{padding:14px;flex:1}nav a{display:block;padding:11px 12px;border-radius:6px;text-decoration:none;color:#ddd}
nav a.on{background:#222;color:var(--or)}.help{margin:14px;padding:14px;border:1px solid #333;border-radius:8px;font-size:13px;color:#bbb}
.main{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;position:sticky;top:0}
header h2{flex:1;font-size:18px}header form{display:flex;align-items:center;gap:12px}.burger{display:none;cursor:pointer;font-size:22px}
.content{padding:24px;flex:1}footer{padding:16px 24px;color:var(--mute);border-top:1px solid var(--line);background:#fff}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.info small{display:block;color:var(--mute);margin-top:10px}.info strong{font-size:20px}.info span{display:block;font-weight:500}.ok{color:var(--ok)}
.cols{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.terms .card{margin:0}
h3{margin:0 0 12px;font-size:17px}h4{font-size:13px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:var(--bg)}th,td{padding:8px 6px;border-bottom:1px solid var(--line)}
.foot{display:flex;justify-content:space-between;font-weight:600;margin:12px 0 0}
.empty{text-align:center;color:var(--mute);padding:26px 0;margin:0}.empty b{display:block;color:var(--ink);margin-bottom:6px}
.panel h3{background:var(--ink);color:#fff;margin:-18px -18px 14px;padding:12px 18px;border-radius:8px 8px 0 0;font-size:14px;border-bottom:3px solid var(--or)}
.ring{width:140px;height:140px;border:6px solid var(--ink);border-radius:50%;margin:8px auto 16px;display:grid;place-content:center;text-align:center;font-size:12px}
.ring b{font-size:30px}dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px}dd{margin:0;font-weight:700}
.btn,.ghost{font:inherit;border-radius:6px;cursor:pointer;padding:10px 16px}.btn{background:var(--ink);color:var(--or);border:0;font-weight:600}
.btn:hover{background:#222}.ghost{background:#fff;border:1px solid var(--ink)}.ghost:hover{background:var(--or)}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid #bbb;border-radius:6px;background:#fff}
.form{display:flex;flex-direction:column;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.flash{background:#fff3e6;border-left:4px solid var(--or);padding:10px 14px;border-radius:4px}.scroll{overflow-x:auto}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:48px}
.brand .logo{font-size:40px;border:0;border-bottom:4px solid var(--or);padding:0 0 18px;display:inline-block;align-self:flex-start}.brand p{color:#bbb;max-width:34ch;font-size:16px}
.login form{align-self:center;justify-self:center;width:min(380px,90%);display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:500}.alt{color:var(--mute);font-size:13px}
@media(max-width:900px){aside{transform:translateX(-100%);transition:transform .2s}#nav:checked~aside{transform:none}.main{margin:0}.burger{display:block}
.cols,.grid2,.login{grid-template-columns:1fr}.brand{padding:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.logo img{vertical-align:middle;border-radius:6px;margin-right:8px;background:#fff}.brand .logo img{width:56px;height:56px}
.badge{background:var(--or);color:#000;font-style:normal;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;margin-left:8px}
.bell{text-decoration:none;font-size:18px}.date{color:var(--mute)}textarea{font:inherit;width:100%;padding:10px;border:1px solid #bbb;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.stats .card{margin:0 0 16px}.stats b{display:block;font-size:28px;border-bottom:3px solid var(--or);width:max-content;margin-bottom:6px}
.pre{white-space:pre-wrap}.reply{background:#fff3e6;border-left:4px solid var(--or);padding:10px 14px;border-radius:4px}
.slot{display:grid;gap:2px;margin:0;padding:10px 0;border-bottom:1px solid var(--line)}.slot small{color:var(--mute)}
.search{display:flex;gap:8px;margin-bottom:12px}.row{display:flex;gap:12px;flex-wrap:wrap}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sum{margin-top:18px;padding-top:12px;border-top:2px solid var(--ink)}.flash{font-weight:600}
@media print{aside,header,footer,.noprint{display:none!important}.main{margin:0}body{background:#fff}.card{border:0}}
.grid2.one{grid-template-columns:1fr}.terms.edit{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}.terms.edit .card{margin:0}
.cell{padding:6px;font-size:13px;min-width:0}.num{width:56px}tr.new td{background:#fff8f0}td input[type=checkbox]{width:auto}
@media(max-width:900px){.terms.edit{grid-template-columns:1fr}.terms.edit table{display:block;overflow-x:auto}}

function setRole(r){role=r;$$(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.role===r));$("#idl").textContent=r==="admin"?"Username":"Student ID";
$("#h").innerHTML="Demo only: use <b>"+ACC[r].u+"</b> / <b>"+ACC[r].p+"</b>. This page is a static preview with sample data, so nothing is saved.";$("#e").textContent=""}
$$(".seg button").forEach(b=>b.onclick=()=>setRole(b.dataset.role));setRole("student");
function frame(i){let f=$("#f"+i);if(!f){f=document.createElement("iframe");f.id="f"+i;
f.srcdoc=PAGES[i].split("{{CSS}}").join($("#appcss").textContent).split("{{LOGO}}").join($("#lg").src);$("#app").appendChild(f)}return f}
function show(i){$$("#app .bar button[data-i],iframe").forEach(e=>e.classList.remove("on"));$('button[data-i="'+i+'"]').classList.add("on");frame(i).classList.add("on")}
function enter(r){role=r;$("#login-view").classList.add("off");$("#app").classList.add("on");$("#who").textContent=ACC[r].n;
$$("#app .bar button[data-r]").forEach(b=>{b.hidden=b.dataset.r!==r;b.onclick=()=>show(b.dataset.i)});show($('button[data-r="'+r+'"]').dataset.i)}
$("#f").onsubmit=e=>{e.preventDefault();const a=ACC[role];if($("#u").value.trim().toUpperCase()===a.u.toUpperCase()&&$("#p").value===a.p){try{sessionStorage.setItem("role",role)}catch(_){}enter(role)}else $("#e").textContent="Wrong ID or password. Check them and try again."};
$("#out").onclick=()=>{try{sessionStorage.removeItem("role")}catch(_){}$("#app").classList.remove("on");$("#login-view").classList.remove("off");$("#p").value="";$$("iframe").forEach(f=>f.classList.remove("on"))};
try{const r=sessionStorage.getItem("role");if(r&&ACC[r])enter(r)}catch(_){}
</script></body></html>
